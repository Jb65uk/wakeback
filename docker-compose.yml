# WakeBack server on the NAS (Ugreen: Docker > Project > Create, paste this).
# Open http://<nas>:5090 on your network; Cloudflare tunnel points at the same.
services:
  wakeback:
    image: ghcr.io/jb65uk/wakeback-server:latest
    container_name: wakeback
    restart: unless-stopped
    ports:
      - "5090:5000"
    volumes:
      - ./data:/app/data          # sessions, venues, pucks live here, next to this file
    environment:
      WAKEBACK_WIFI: wakeback      # the dock WiFi name shown on the Dock page
      WAKEBACK_OWNER: ""           # owner for pucks with none set (e.g. "Southport SC"); blank for personal use
