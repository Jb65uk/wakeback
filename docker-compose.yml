# WakeBack server on the NAS (Ugreen: Docker > Project > Create, paste this).
# Open http://<nas>:5090 on your network; Cloudflare tunnel points at the same.
services:
  wakeback:
    image: ghcr.io/jb65uk/wakeback-server:latest
    container_name: wakeback
    restart: unless-stopped
    ports:
      - "5090:5000"
    volumes:
      - ./data:/app/data          # sessions, venues, pucks live here, next to this file
    environment:
      WAKEBACK_ADMIN: "you@example.com"   # your email: turns accounts on, and makes that account the admin (/admin)
      # Locked out of the admin account? Add the line below with a new password, restart, log in, then remove it again:
      # WAKEBACK_ADMIN_RESET: "a-new-password"
      WAKEBACK_WIFI: wakeback              # the dock WiFi name shown on the Dock page
      WAKEBACK_OWNER: ""                   # owner for pucks with none set (e.g. "Southport SC"); blank for personal use
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Keeps the server current: every 30 minutes it asks GitHub for a newer wakeback-server image and, if
  # there is one, pulls it and restarts the container (a few seconds). Only containers with the label above.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: wakeback-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"           # delete the old image after an update
      WATCHTOWER_POLL_INTERVAL: "1800"
      TZ: Europe/London

  # Nightly backup of everything (tracks, venues, accounts) into ./backups next to this file, one
  # wakeback-YYYY-MM-DD.tar.gz a day, the last 14 kept. Point the NAS's own backup / cloud sync at that
  # folder so a copy leaves the building.
  backup:
    image: alpine:3
    container_name: wakeback-backup
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    environment:
      TZ: Europe/London
    command: >
      sh -c 'apk add --no-cache sqlite tar >/dev/null;
      while true; do
        d=$$(date +%F); tmp=/tmp/wb-$$d; rm -rf $$tmp; mkdir -p $$tmp;
        cp -r /data/. $$tmp/ 2>/dev/null;
        [ -f /data/wakeback.db ] && sqlite3 /data/wakeback.db ".backup $$tmp/wakeback.db";
        rm -f $$tmp/wakeback.db-wal $$tmp/wakeback.db-shm;
        tar -czf /backups/wakeback-$$d.tar.gz -C $$tmp . && echo "backup wakeback-$$d.tar.gz";
        rm -rf $$tmp;
        ls -1t /backups/wakeback-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm -f;
        sleep 86400;
      done'
