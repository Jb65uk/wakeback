# WakeBack server on the NAS (Ugreen: Docker > Project > Create, paste this).
# Open http://<nas>:5090 on your network; Cloudflare tunnel points at the same.
services:
  wakeback:
    image: ghcr.io/jb65uk/wakeback-server:latest
    container_name: wakeback
    restart: unless-stopped
    ports:
      - "5090:5000"
    volumes:
      - ./data:/app/data          # sessions, venues, pucks live here, next to this file
    environment:
      WAKEBACK_ADMIN: "you@example.com"   # your email: turns accounts on, and makes that account the admin (/admin)
      WAKEBACK_WIFI: wakeback              # the dock WiFi name shown on the Dock page
      WAKEBACK_OWNER: ""                   # owner for pucks with none set (e.g. "Southport SC"); blank for personal use
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Keeps the server current: every 30 minutes it asks GitHub for a newer wakeback-server image and, if
  # there is one, pulls it and restarts the container (a few seconds). Only containers with the label above.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: wakeback-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"           # delete the old image after an update
      WATCHTOWER_POLL_INTERVAL: "1800"
      TZ: Europe/London
