; WakeBack bench test: checks each part on the breadboard and records a test track.
; Open this folder (firmware/bench_test) in VS Code with the PlatformIO extension, then Build and Upload.
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = direct
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  sparkfun/SparkFun u-blox GNSS v3
  adafruit/Adafruit BNO08x
