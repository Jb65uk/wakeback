; WakeBack puck firmware (the real one). See README.md in this folder.
; Open this folder (firmware/puck) in VS Code with the PlatformIO extension, then Build and Upload.
; CI builds it too: .github/workflows/build-firmware.yml publishes puck.bin as a release.
[env:xiao_esp32s3]
platform = espressif32@6.9.0      ; pinned so every build (yours and CI) uses the same core
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = direct
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DWB_FW_VERSION=\"1.0.0\"
lib_deps =
  sparkfun/SparkFun u-blox GNSS v3
  adafruit/Adafruit BNO08x
