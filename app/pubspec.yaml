name: wakeback
description: WakeBack phone/tablet app — the dock in your pocket, running the real WakeBack viewer.
publish_to: 'none'
version: 0.8.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

# Ranges, so `flutter pub get` picks the newest versions that work with your Flutter SDK.
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: '>=4.10.0 <5.0.0'
  webview_flutter_android: '>=3.16.0 <5.0.0'
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: '>=1.2.2 <2.0.0'
  share_plus: '>=10.1.2 <12.0.0'
  file_picker: '>=8.1.2 <11.0.0'
  mime: '>=1.0.4 <3.0.0'
  package_info_plus: '>=8.0.0 <10.0.0'
  open_filex: '>=4.5.0 <5.0.0'
  geolocator: '>=13.0.1 <15.0.0'   # Record tab: the phone's own GPS, as a foreground service

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_launcher_icons: '>=0.13.1 <1.0.0'

# App icon: a boat arrow at the head of its wake. Source: assets/icon/make_icon.py
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#13293A'
  adaptive_icon_foreground: assets/icon/icon_fg.png
  adaptive_icon_monochrome: assets/icon/icon_mono.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/web/
