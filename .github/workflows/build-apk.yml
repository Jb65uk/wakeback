# Builds the WakeBack Android app in the cloud and publishes WakeBack.apk.
# Runs on every push that touches the app or viewer, or by hand: Actions tab -> Build WakeBack APK -> Run workflow.
# Download on your phone:  https://github.com/<you>/<repo>/releases/latest  -> WakeBack.apk
name: Build WakeBack APK

on:
  push:
    paths: ['app/**', 'viewer/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
        shell: bash   # -eo pipefail, so a failure inside "| tee" still fails the step
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Latest viewer into the app
        run: cp ../viewer/index.html ../viewer/dock.html assets/web/

      - name: Android project + permissions
        run: |
          flutter create --platforms=android --org uk.bridgesolutions --project-name wakeback .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />', s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="wakeback"', 'android:label="WakeBack"')
          open(p, 'w').write(s)
          PY

      - name: Release signing key (same key every build, so updates install over the top)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::warning title=Signing::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets yet: this APK uses a throwaway key and won't install over an earlier build."
            exit 0
          fi
          echo "$KS" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=wakeback\nkeyPassword=%s\n' "$KP" "$KP" > android/key.properties
          python3 tool/use_release_key.py

      - run: flutter pub get 2>&1 | tee -a ci.log

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Compile check (every error at once, before the slow build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Tests (phone dock behaves like app.py, sync)
        run: flutter test --reporter expanded 2>&1 | tee -a ci.log

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk WakeBack.apk

      # If anything above failed, put the important lines on the run as error notes, which can be read
      # through the GitHub API (and show on the run's page) without downloading the full log.
      - name: Report what failed
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          lines = open('ci.log', errors='ignore').read().splitlines() if os.path.exists('ci.log') else ['no log captured']
          pick = re.compile(r'error|Error|FAILED|failed|Expected:|Actual:|Which:|Exception|\.dart:\d+|\[E\]|Some tests|^e: |\.kts:\d+|^\s*\^')
          keep = [l.strip()[:300] for l in lines if pick.search(l)] or lines[-40:]
          keep = keep[-80:]
          esc = lambda t: t.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          for i in range(0, len(keep), 20):
              print('::error title=WakeBack build (part %d)::%s' % (i // 20 + 1, esc('\n'.join(keep[i:i + 20]))))
          # the patched Gradle file, so a signing-setup problem can be read off the run
          for g in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if os.path.exists(g):
                  src = open(g, errors='ignore').read().splitlines()
                  for i in range(0, len(src), 40):
                      print('::warning title=%s (lines %d+)::%s' % (g, i + 1, esc('\n'.join('%3d %s' % (i + j + 1, l) for j, l in enumerate(src[i:i + 40])))))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: WakeBack-apk
          path: app/WakeBack.apk

      - name: Publish as a release (fixed download link)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: WakeBack app build ${{ github.run_number }}
          body: Open this page on your phone, tap WakeBack.apk, then open the download and allow "install unknown apps".
          files: app/WakeBack.apk
          make_latest: true
