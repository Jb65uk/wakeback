# Builds the server container and publishes it to GitHub's registry:
#   ghcr.io/jb65uk/wakeback-server:latest   (amd64 for the NAS, arm64 for a Pi)
name: Server image

on:
  push:
    branches: [main]
    paths: ['server/**', 'viewer/**', 'tools/test_server.py', 'Dockerfile', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Server checks (accounts, stats, forgot password, export, delete) before anything is published
        run: |
          pip install -r server/requirements.txt
          python tools/test_server.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jb65uk/wakeback-server:latest
            ghcr.io/jb65uk/wakeback-server:${{ github.sha }}
